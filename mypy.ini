# Tier 51: the typed core - every file mypy finds clean (2026-11-26: 73 of the 130
# in the app's packages, plus the bench runners). CI's blocking "Type check (typed core)"
# job and tests/test_tier51_typed_core.py keep them clean; the rest stays in CI's
# advisory mypy run - fix a file's errors there, then add it here.
[mypy]
python_version = 3.11
platform = win32
ignore_missing_imports = True
follow_imports = silent
files =
    automation/__init__.py,
    automation/backends/__init__.py,
    automation/backends/base.py,
    automation/backends/macos.py,
    automation/backends/windows.py,
    automation/calculator.py,
