name: CI

on:
  push:
    paths-ignore:
      - "**.md"
      - "**.MD"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "**.MD"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch: {}

# Cancel superseded runs on the same branch/PR so pushes don't queue behind
# stale CI runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (pyflakes)
    # Pure AST analysis - doesn't import the project or need its
    # dependencies installed, so the cheap/fast runner is the right choice.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pyflakes
        run: |
          python -m pip install --upgrade pip
          pip install pyflakes

      - name: Run pyflakes (fail only on real issues, not unused imports)
        shell: bash
        run: |
          set +e
          OUTPUT=$(python -m pyflakes . 2>&1)
          echo "$OUTPUT"

          # pyflakes has no --select/--ignore flag (that's a flake8 thing) --
          # so unused-import lines are filtered out of its plain-text output
          # here, and the build only fails if something else remains
          # (syntax errors, undefined names, etc.). This codebase leans on
          # try/except HAS_X-style optional imports (see requirements.txt),
          # which pyflakes routinely flags as "unused" even when they're not.
          REAL_ISSUES=$(echo "$OUTPUT" | grep -v "imported but unused")

          if [ -n "$REAL_ISSUES" ]; then
            echo ""
            echo "::error::pyflakes found real issues (excluding unused imports):"
            echo "$REAL_ISSUES"
            exit 1
          fi

          echo "pyflakes: no real issues found (unused-import warnings ignored)."
          exit 0

  test:
    name: Test
    # NOTE: windows-latest only, on purpose. requirements.txt pins winsdk
    # (Core section - no Linux/macOS wheel at all) plus pywin32/pycaw/comtypes,
    # so a plain `pip install -r requirements.txt` hard-fails on ubuntu-latest
    # before a single test can run. requirements.txt itself says "Tested with
    # Python 3.11 on Windows" - this mirrors that exactly, the same call
    # sara_project's CI already makes for the identical reason.
    #
    # The test suite's own first-party code (tests/_phase4_support.py,
    # tests/_ac_scenarios.py) goes out of its way to stub pyautogui/pywhatkit
    # so it CAN run headless - that's a nice property for later, but doesn't
    # remove the winsdk install blocker, so windows-latest stays the one
    # source of truth for now.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        shell: bash
        run: |
          pytest tests/ -v \
            --junitxml=test-results.xml \
            --cov=automation --cov=brain --cov=database --cov=monitoring --cov=settings --cov=ui --cov=voice \
            --cov-report=xml --cov-report=term-missing

      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  type-check:
    name: Type check (mypy, non-blocking)
    # Same reasoning as lint: --ignore-missing-imports means this never
    # needs the real (Windows-only) dependencies installed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true  # advisory only -- never blocks the pipeline
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install mypy
        run: |
          python -m pip install --upgrade pip
          pip install mypy

      - name: Run mypy
        shell: bash
        run: mypy automation/ brain/ database/ monitoring/ settings/ ui/ vision/ voice/ web/ --ignore-missing-imports
