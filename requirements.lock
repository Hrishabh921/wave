# requirements.lock - Wave AI dependency lock (Tier 22).
#
# TWO DIFFERENT KINDS OF LINE LIVE IN THIS FILE. Read this header before
# trusting either section.
#
# =====================================================================
# SECTION 1 — AUTHORITATIVE: direct dependencies
# =====================================================================
# These are copied verbatim from requirements.txt and
# requirements-voice-local.txt, which are themselves exact (==) pins
# chosen by this project, "pulled from the project's own working venv,
# not guessed" (requirements.txt's own header comment). This section is
# genuinely authoritative on every platform, including Windows, because
# it names no transitive sub-dependency - it's just this project's own
# direct pins, restated here for a single install target.
#
# =====================================================================
# SECTION 2 — REFERENCE ONLY: transitive closure, resolved on Linux
# =====================================================================
# Everything below "Transitive dependencies" was produced by running
#     pip install --dry-run --report <report.json> <every pin from Section 1>
# in a clean throwaway venv IN THIS LINUX SANDBOX - there is no Windows
# machine available here to resolve against. Treat it as a reference
# snapshot, not a validated Windows lock:
#
#   - Five of this project's own direct, Windows-only dependencies
#     could NOT be resolved at all in this sandbox and are therefore
#     MISSING below, not because they have no sub-dependencies:
#       pywin32, pycaw, comtypes, winsdk, keyboard
#     Their own transitive requirements (if any) are simply unknown
#     from this machine.
#   - A further 19 packages that the Linux resolver pulled in were
#     excluded from the list below because they are Linux-specific
#     artifacts that would never appear in, and would be wrong for, a
#     genuine Windows resolution: the `nvidia-cu13`/`cuda-*` CUDA
#     runtime wheels (pulled in by torch's Linux-only extras via
#     sentence-transformers) and `python3-xlib` (pyautogui's Linux
#     backend; Windows has no X11). A Windows resolution of the same
#     direct pins will pull in Windows-appropriate equivalents instead
#     (if any) - this file does not guess what those are.
#   - `triton` (torch's JIT backend) appears below because the Linux
#     resolver pulled it in; its Windows wheel availability for this
#     exact torch version was not independently checked here either -
#     treat it the same as any other reference-only line.
#
# To get the TRUE, authoritative lock: run scripts/freeze_requirements.ps1
# on a real Windows machine with Python 3.11. That script installs
# Section 1's pins into a clean venv and overwrites this file's
# Section 2 with a real `pip freeze` from Windows. Until that's been
# run, do not treat Section 2 as validated for anyone deploying on
# Windows - which is this project's only officially supported platform
# (see BUILD.md, docs/PACKAGING.md).
#
# Generated: 2026-11-07, via `pip install --dry-run --report` in
# /tmp/lockvenv against every pin below, Python 3.11, Linux sandbox.

